name: EAS Build & Submit CI/CD

on:
  push:
    branches:
      - main
      - release/*
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      platform:
        description: 'เลือก Platform ที่ต้องการ Build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - android
          - ios
      profile:
        description: 'เลือก EAS Build Profile'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview
          - development
      auto_submit:
        description: 'ส่งขึ้น Store อัตโนมัติหลัง Build เสร็จหรือไม่ (EAS Submit)'
        required: true
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. ตรวจสอบคุณภาพโค้ดและ Type Check
  test-and-lint:
    name: 🔍 Test & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔎 TypeScript Type Check
        run: npx tsc --noEmit

  # 2. Build ด้วย EAS (รันเฉพาะเมื่อผ่าน test และเป็น Push หรือ Manual Dispatch)
  eas-build:
    name: 🚀 EAS Build (${{ github.event.inputs.platform || 'all' }})
    needs: test-and-lint
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: 🛠️ Setup Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        run: npm ci

      # สั่ง Build ตามเงื่อนไข (Trigger จาก Push ไปยัง main หรือกด Run Workflow เอง)
      - name: 🏗️ Run EAS Build
        id: build
        run: |
          PLATFORM="${{ github.event.inputs.platform || 'all' }}"
          PROFILE="${{ github.event.inputs.profile || 'production' }}"
          
          echo "Starting EAS Build for platform: $PLATFORM with profile: $PROFILE"
          eas build --platform $PLATFORM --profile $PROFILE --non-interactive --no-wait

  # 3. ส่งขึ้น Google Play Store และ Apple App Store (Optional)
  eas-submit:
    name: 📲 Submit to Stores
    needs: eas-build
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event.inputs.auto_submit == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: 🛠️ Setup Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        run: npm ci

      - name: 📤 Submit Android to Google Play
        if: github.event.inputs.platform == 'all' || github.event.inputs.platform == 'android' || github.event_name == 'push'
        run: |
          eas submit --platform android --latest --profile production --non-interactive || echo "Android submit skipped or pending credentials"

      - name: 📤 Submit iOS to App Store Connect
        if: github.event.inputs.platform == 'all' || github.event.inputs.platform == 'ios' || github.event_name == 'push'
        run: |
          eas submit --platform ios --latest --profile production --non-interactive || echo "iOS submit skipped or pending credentials"
